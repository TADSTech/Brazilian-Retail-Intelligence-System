name: Synthetic Order Generation

on:
  schedule:
    # Hourly synthetic traffic against the deployed API.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger-order-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger order generation
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_URL }}/orders/generate" \
            -H "Content-Type: application/json" \
            -d '{"count": 50}'
