name: ETL

on:
  workflow_dispatch:
    inputs:
      tables:
        description: "Space-separated tables to load (blank = all)"
        required: false
        default: ""
      full_reload:
        description: "Force full reload (upsert every row)"
        type: boolean
        required: false
        default: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install kaggle

      - name: Download Olist CSVs (Kaggle)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d olistbr/brazilian-ecommerce -p data --unzip
          ls -la data/

      - name: Run ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TABLES: ${{ github.event.inputs.tables }}
          FULL_RELOAD: ${{ github.event.inputs.full_reload }}
        run: |
          args=""
          if [ -n "$TABLES" ]; then args="--tables $TABLES"; fi
          if [ "$FULL_RELOAD" = "true" ]; then args="$args --full-reload"; fi
          python -m etl $args
